<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ORCHESTRA VARIABLE · 自适应 UI 版</title>
  <style>
    @font-face {
      font-family: "Orchestra Variable Top";
      src: url("OrchestraVariableTop-VariableVF.ttf") format("truetype");
      font-weight: 0 900;
    }
    @font-face {
      font-family: "Orchestra Variable Bottom";
      src: url("OrchestraVariableBottom-VariableVF.ttf") format("truetype");
      font-weight: 0 900;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #f5f1e8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
      background: #000;
    }
    #wordContainer {
      position: absolute;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%);
      width: fit-content;
      max-width: 94vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.05em;
      user-select: none;
      pointer-events: none;
      transition: gap 0.15s ease;
      z-index: 1;
    }
    #topRow, #bottomRow {
      display: flex;
      justify-content: center;
      white-space: nowrap;
      letter-spacing: 0.02em;
      line-height: 1;
    }
    .top-char, .bottom-char {
      font-size: 120px;
      color: #f5f1e8;
      display: inline-block;
      /* Avoid forcing a separate compositing layer for every glyph on iPad. */
    }
    .top-char { font-family: "Orchestra Variable Top", serif; }
    .bottom-char { font-family: "Orchestra Variable Bottom", serif; }

    #footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(44px, calc(env(safe-area-inset-bottom) + 28px));
      z-index: 20;
      padding: 8px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px 12px;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(6px);
      color: rgba(245, 241, 232, 0.88);
      font-size: clamp(11px, 1.8vw, 14px);
      letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums;
    }
    #weightReadout {
      padding: 4px 10px;
      border: 1px solid rgba(245, 241, 232, 0.28);
      background: rgba(0, 0, 0, 0.8);
      color: #f5f1e8;
      white-space: nowrap;
    }
    #startButton {
      appearance: none;
      border: 1px solid rgba(245, 241, 232, 0.75);
      padding: clamp(6px, 1vh, 9px) clamp(12px, 2vw, 18px);
      background: rgba(22, 22, 22, 0.95);
      color: #f5f1e8;
      font: inherit;
      letter-spacing: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    #startButton:active {
      background: #f5f1e8;
      color: #000;
    }
    #startButton:disabled {
      opacity: 0.45;
      cursor: wait;
    }
    #status {
      display: inline-block;
      max-width: 92vw;
      color: rgba(245, 241, 232, 0.82);
      text-align: center;
      line-height: 1.35;
    }

    #cameraFrame {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      width: clamp(96px, min(220px, 24vw), 220px);
      aspect-ratio: 4 / 3;
      padding: 3px;
      border: 1px solid rgba(245, 241, 232, 0.45);
      background: rgba(0, 0, 0, 0.8);
      overflow: hidden;
      z-index: 10;
    }
    #cameraPreview {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      transform: scaleX(-1);
    }

    @media (max-height: 520px) {
      #footer {
        bottom: max(22px, calc(env(safe-area-inset-bottom) + 12px));
        padding: 6px 10px;
        gap: 6px 10px;
      }
    }

    #testPanel {
      position: fixed;
      left: 12px;
      top: max(12px, env(safe-area-inset-top));
      z-index: 30;
      width: min(300px, 46vw);
      padding: 12px 14px;
      background: rgba(0,0,0,.82);
      border: 1px solid rgba(245,241,232,.35);
      color: #f5f1e8;
      font-size: 12px;
      letter-spacing: .04em;
      touch-action: pan-y;
    }
    #testPanel h2 { margin: 0 0 10px; font-size: 12px; font-weight: 500; }
    .sliderRow { display: grid; grid-template-columns: 58px 1fr 44px; gap: 8px; align-items: center; margin: 9px 0; }
    .sliderRow input { width: 100%; min-width: 0; accent-color: #f5f1e8; }
    .sliderValue { text-align: right; font-variant-numeric: tabular-nums; }
    #manualMode { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    #manualMode input { accent-color: #f5f1e8; }
    #testHint { opacity: .65; line-height: 1.35; margin-top: 7px; }
    @media (max-width: 700px) {
      #testPanel { width: min(270px, 52vw); padding: 9px 10px; }
      .sliderRow { grid-template-columns: 48px 1fr 38px; gap: 5px; }
    }
    #cameraPlaceholder, .preview, .controls, h1, .intro, .readout, .help { display: none !important; }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div id="wordContainer" aria-label="ORCHESTRAVARIABLE">
      <div id="topRow"></div>
      <div id="bottomRow"></div>
    </div>
    <section id="testPanel" aria-label="临时测试调节">
      <h2>TEST CONTROLS</h2>
      <div class="sliderRow"><label for="gapSlider">Gap</label><input id="gapSlider" type="range" min="-160" max="100" step="1" value="5"><span class="sliderValue" id="gapValue">5 px</span></div>
      <div class="sliderRow"><label for="sizeSlider">Size</label><input id="sizeSlider" type="range" min="40" max="520" step="1" value="220"><span class="sliderValue" id="sizeValue">220</span></div>
      <div class="sliderRow"><label for="weightSlider">Weight</label><input id="weightSlider" type="range" min="0" max="900" step="1" value="0"><span class="sliderValue" id="weightValue">0</span></div>
      <label id="manualMode"><input id="manualToggle" type="checkbox"> Manual weight (ignore camera)</label>
      <div id="testHint">临时测试：滑动记录最细/最粗时合适的字号和行距。</div>
    </section>
    <div id="cameraFrame" aria-label="摄像头画面">
      <canvas id="cameraPreview" width="320" height="240"></canvas>
    </div>
    <div id="footer">
      <span id="weightReadout">wght 0</span>
      <button id="startButton" type="button">开启摄像头</button>
      <span id="status" aria-live="polite"></span>
    </div>
    <video id="video" playsinline muted style="display:none"></video>
  </div>

<script type="module">
  import {
    FilesetResolver,
    HandLandmarker
  } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

  const TEXT = "ORCHESTRAVARIABLE";
  const CHAR_COUNT = TEXT.length;
  const SPLIT_INDEX = 9;

  const video = document.querySelector("#video");
  const cameraPreview = document.querySelector("#cameraPreview");
  const previewContext = cameraPreview.getContext("2d", { willReadFrequently: true });
  const topRow = document.querySelector("#topRow");
  const bottomRow = document.querySelector("#bottomRow");
  const wordContainer = document.querySelector("#wordContainer");
  const footer = document.querySelector("#footer");
  const status = document.querySelector("#status");
  const weightReadout = document.querySelector("#weightReadout");
  const startButton = document.querySelector("#startButton");

  const topSpans = [];
  const bottomSpans = [];

  for (let i = 0; i < CHAR_COUNT; i++) {
    const ch = TEXT[i];

    const tSpan = document.createElement("span");
    tSpan.className = "top-char";
    tSpan.textContent = ch;
    topRow.appendChild(tSpan);
    topSpans.push(tSpan);

    const bSpan = document.createElement("span");
    bSpan.className = "bottom-char";
    bSpan.textContent = ch;
    bottomRow.appendChild(bSpan);
    bottomSpans.push(bSpan);
  }

  const currentWeights = new Array(CHAR_COUNT).fill(0);
  const currentXhetDeltas = new Array(CHAR_COUNT).fill(0);

  let palmStableFrames = 0;
  const PALM_STABLE_NEED = 6;

  let landmarker = null;
  let stream = null;
  let animationId = null;
  let lastVideoTime = -1;

  const gapSlider = document.querySelector("#gapSlider");
  const sizeSlider = document.querySelector("#sizeSlider");
  const weightSlider = document.querySelector("#weightSlider");
  const manualToggle = document.querySelector("#manualToggle");
  const gapValue = document.querySelector("#gapValue");
  const sizeValue = document.querySelector("#sizeValue");
  const weightValue = document.querySelector("#weightValue");
  const testPanel = document.querySelector("#testPanel");

  let testGapPx = Number(gapSlider.value);
  let testFontSize = Number(sizeSlider.value);
  let manualWeight = Number(weightSlider.value);
  let manualMode = false;
  let lastPreviewTime = 0;
  let lastDetectionTime = 0;
  const DETECTION_INTERVAL = 65; // about 15 fps on iPad
  const PREVIEW_INTERVAL = 120; // about 8 fps; preview is decorative
  let xhetMissFrames = 0;
  const XHET_HOLD_FRAMES = 8;

  function updateLayout() {
    const vw = window.innerWidth;
    const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    const panelRect = testPanel.getBoundingClientRect();
    const footerRect = footer.getBoundingClientRect();
    const topReserved = Math.max(24, panelRect.bottom + 16);
    const bottomReserved = Math.max(80, vh - footerRect.top + 12);
    const usableHeight = Math.max(100, vh - topReserved - bottomReserved);
    const usableWidth = Math.max(120, vw * 0.94);
    const fontSize = Math.min(testFontSize, usableHeight * 0.48, usableWidth / 9.2);
    for (const span of [...topSpans, ...bottomSpans]) span.style.fontSize = `${fontSize}px`;
    wordContainer.style.gap = `${testGapPx}px`;
    wordContainer.style.top = `${topReserved + usableHeight / 2}px`;
    wordContainer.style.transform = "translate(-50%, -50%)";
  }

  function applyAxes() {
    for (let i = 0; i < CHAR_COUNT; i++) {
      const w = Math.round(manualMode ? manualWeight : currentWeights[i]);
      const bottomXhet = Math.round(Math.max(0, Math.min(100, 50 + currentXhetDeltas[i])));
      const topXhet = 100 - bottomXhet;
      topSpans[i].style.fontVariationSettings = `"wght" ${w}, "XHET" ${topXhet}, "wdth" 75, "opsz" 72`;
      bottomSpans[i].style.fontVariationSettings = `"wght" ${w}, "XHET" ${bottomXhet}, "wdth" 75, "opsz" 72`;
    }
    const average = manualMode ? manualWeight : currentWeights.reduce((a,b) => a+b, 0) / CHAR_COUNT;
    weightReadout.textContent = `wght ${Math.round(average)}`;
  }

  function updateDOM() {
    updateLayout();
    applyAxes();
  }

  gapSlider.addEventListener("input", () => {
    testGapPx = Number(gapSlider.value);
    gapValue.textContent = `${testGapPx} px`;
    updateLayout();
  });
  sizeSlider.addEventListener("input", () => {
    testFontSize = Number(sizeSlider.value);
    sizeValue.textContent = `${testFontSize}`;
    updateLayout();
  });
  weightSlider.addEventListener("input", () => {
    manualWeight = Number(weightSlider.value);
    weightValue.textContent = `${manualWeight}`;
    if (manualMode) applyAxes();
  });
  manualToggle.addEventListener("change", () => {
    manualMode = manualToggle.checked;
    if (manualMode) applyAxes();
  });

  function renderCameraPreview() {
    if (video.readyState < 2) return;
    previewContext.drawImage(video, 0, 0, cameraPreview.width, cameraPreview.height);
    const frame = previewContext.getImageData(0, 0, cameraPreview.width, cameraPreview.height);
    const pixels = frame.data;
    for (let i = 0; i < pixels.length; i += 4) {
      const gray = 0.299 * pixels[i] + 0.587 * pixels[i + 1] + 0.114 * pixels[i + 2];
      const level = Math.min(4, Math.round(gray / 255 * 4));
      const value = [0, 64, 128, 192, 255][level];
      pixels[i] = pixels[i + 1] = pixels[i + 2] = value;
    }
    previewContext.putImageData(frame, 0, 0);
  }

  async function createHandLandmarkerWithFallback(vision) {
    const modelUrl =
      "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
    try {
      return await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: modelUrl,
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 2
      });
    } catch (gpuError) {
      console.warn("GPU delegate failed, falling back to CPU:", gpuError);
      status.textContent = "GPU 初始化失败，正在切换 CPU 模式…";
      return await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: modelUrl,
          delegate: "CPU"
        },
        runningMode: "VIDEO",
        numHands: 2
      });
    }
  }

  async function start() {
    startButton.disabled = true;
    status.textContent = "正在请求摄像头权限…";
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("当前浏览器环境不支持调用摄像头，请使用 Safari 或 Chrome 的 HTTPS 链接打开");
      }

      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();

      status.textContent = "摄像头已开启，正在加载手势模型…";
      loop();

      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

      landmarker = await createHandLandmarkerWithFallback(vision);

      status.textContent = "请将一只手横向摊开";
      startButton.textContent = "终止摄像";
      startButton.disabled = false;
      updateDOM();
    } catch (error) {
      console.error(error);
      stopCameraOnly();
      status.textContent = "启动失败：" + (error.message || error);
      startButton.textContent = "开启摄像头";
      startButton.disabled = false;
      updateDOM();
    }
  }

  function loop() {
    if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
      lastVideoTime = video.currentTime;
      const now = performance.now();
      if (now - lastPreviewTime >= PREVIEW_INTERVAL) {
        renderCameraPreview();
        lastPreviewTime = now;
      }
      if (landmarker && !manualMode && now - lastDetectionTime >= DETECTION_INTERVAL) {
        lastDetectionTime = now;
        try {
          const results = landmarker.detectForVideo(video, now);
          updateFromResults(results);
        } catch (detectError) {
          console.error("Detect frame error:", detectError);
        }
      }
    }
    animationId = requestAnimationFrame(loop);
  }

  function distance(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  function parseHand(points) {
    const wrist = points[0];
    const middleMcp = points[9];
    const middleTip = points[12];
    const indexTip = points[8];
    const palmScale = Math.max(distance(wrist, middleMcp), 0.001);

    const tips = [4, 8, 12, 16, 20];
    const reaches = tips.map(idx => distance(points[idx], wrist) / palmScale);
    const openness = reaches.reduce((a, b) => a + b, 0) / reaches.length;

    const indexR = reaches[1], middleR = reaches[2], ringR = reaches[3], pinkyR = reaches[4];
    const fingersCurled = indexR < 1.22 && middleR < 1.22 && ringR < 1.22 && pinkyR < 1.22;
    const isFist = openness < 1.22 && fingersCurled;

    const axisX = middleMcp.x - wrist.x;
    const axisY = middleMcp.y - wrist.y;
    const axisLen = Math.hypot(axisX, axisY) || 0.001;
    const verticalRatio = Math.abs(axisY) / axisLen;
    const isNearlyHorizontal = verticalRatio < 0.32;
    const isOpenPalm = openness > 1.68;

    const ringTip = points[16];
    const tipYSpread = Math.max(
      Math.abs(indexTip.y - middleTip.y),
      Math.abs(ringTip.y - middleTip.y),
      Math.abs(indexTip.y - ringTip.y)
    );
    const fingersAligned = tipYSpread < 0.07;
    const isHorizontalPalm = isNearlyHorizontal && isOpenPalm && fingersAligned;

    const mirroredX = Math.max(0, Math.min(1, 1 - indexTip.x));
    const letterPos = mirroredX * (CHAR_COUNT - 1);

    const normalizedHeight = Math.max(0, Math.min(1, (0.85 - indexTip.y) / 0.7));
    const xhetDelta = (normalizedHeight - 0.5) * 150;
    const weightFromY = Math.round(normalizedHeight * 900);

    const xs = points.map(p => p.x);
    const ys = points.map(p => p.y);
    const apparentArea = (Math.max(...xs) - Math.min(...xs)) *
      (Math.max(...ys) - Math.min(...ys));

    return {
      mirroredX,
      apparentArea,
      letterPos,
      xhetDelta,
      isFist,
      isHorizontalPalm,
      weightFromY,
      openness,
      verticalRatio
    };
  }

  function updateFromResults(results) {
    const rawHands = results.landmarks || [];

    if (rawHands.length === 0) {
      palmStableFrames = 0;
      xhetMissFrames++;
      // Hold the last XHET briefly through intermittent landmark loss.
      if (xhetMissFrames > XHET_HOLD_FRAMES) {
        for (let i = 0; i < CHAR_COUNT; i++) {
          currentXhetDeltas[i] += (0 - currentXhetDeltas[i]) * 0.035;
        }
      }
      applyAxes();
      status.textContent = "未检测到手 · 保持上次控制";
      return;
    }
    xhetMissFrames = 0;

    const parsed = rawHands
      .map(parseHand)
      .sort((a, b) => b.apparentArea - a.apparentArea)
      .slice(0, 2)
      .sort((a, b) => a.mirroredX - b.mirroredX);

    let leftHand = null;
    let rightHand = null;

    if (parsed.length >= 2) {
      leftHand = parsed[0];
      rightHand = parsed[parsed.length - 1];
    } else {
      if (parsed[0].mirroredX < 0.5) leftHand = parsed[0];
      else rightHand = parsed[0];
    }

    const freezeLeft = leftHand ? leftHand.isFist : false;
    const freezeRight = rightHand ? rightHand.isFist : false;

    const weightHand = parsed
      .filter(h => h.isHorizontalPalm)
      .sort((a, b) => b.apparentArea - a.apparentArea)[0];

    if (weightHand) {
      palmStableFrames++;
    } else {
      palmStableFrames = Math.max(0, palmStableFrames - 1);
    }

    const isAdjustingWeight = !!weightHand;

    if (!isAdjustingWeight) {
      const targetDeltas = new Array(CHAR_COUNT).fill(0);

      if (parsed.length === 1) {
        const h = parsed[0];
        const spread = 2.2;
        for (let i = 0; i < CHAR_COUNT; i++) {
          const dist = Math.abs(i - h.letterPos);
          const factor = Math.exp(-(dist * dist) / (2 * spread * spread));
          targetDeltas[i] = h.xhetDelta * factor;
        }
      } else {
        const lH = parsed[0];
        const rH = parsed[parsed.length - 1];
        const span = Math.max(rH.letterPos - lH.letterPos, 0.001);

        for (let i = 0; i < CHAR_COUNT; i++) {
          if (i <= lH.letterPos) {
            const dist = lH.letterPos - i;
            targetDeltas[i] = lH.xhetDelta * Math.exp(-(dist * dist) / 4);
          } else if (i >= rH.letterPos) {
            const dist = i - rH.letterPos;
            targetDeltas[i] = rH.xhetDelta * Math.exp(-(dist * dist) / 4);
          } else {
            const t = (i - lH.letterPos) / span;
            targetDeltas[i] = lH.xhetDelta + t * (rH.xhetDelta - lH.xhetDelta);
          }
        }
      }

      for (let i = 0; i < CHAR_COUNT; i++) {
        const isLeftSide = i < SPLIT_INDEX;
        const isFrozen = isLeftSide ? freezeLeft : freezeRight;
        if (isFrozen) continue;
        currentXhetDeltas[i] += (targetDeltas[i] - currentXhetDeltas[i]) * 0.12;
      }
    }

    if (weightHand && palmStableFrames >= PALM_STABLE_NEED) {
      const targetW = weightHand.weightFromY;
      for (let i = 0; i < CHAR_COUNT; i++) {
        currentWeights[i] += (targetW - currentWeights[i]) * 0.08;
      }
    }

    applyAxes();

    if (weightHand) {
      status.textContent = palmStableFrames >= PALM_STABLE_NEED
        ? "调整字重中 · XHET 已锁定"
        : "摊开手掌以调整字重";
    } else {
      status.textContent = "请将一只手横向摊开";
    }
  }

  function stopCameraOnly() {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }
    video.srcObject = null;
    previewContext.clearRect(0, 0, cameraPreview.width, cameraPreview.height);
  }

  function stop() {
    if (animationId) cancelAnimationFrame(animationId);
    animationId = null;
    stopCameraOnly();
    if (landmarker) {
      landmarker.close();
      landmarker = null;
    }
    currentWeights.fill(0);
    currentXhetDeltas.fill(0);
    palmStableFrames = 0;
    applyAxes();
    startButton.textContent = "开启摄像头";
    startButton.disabled = false;
    status.textContent = "已停止";
  }

  startButton.addEventListener("click", () => {
    if (stream) stop();
    else start();
  });
  window.addEventListener("beforeunload", stopCameraOnly);
  window.addEventListener("resize", updateLayout);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", updateLayout);
  updateDOM();
</script>
</body>
</html>
