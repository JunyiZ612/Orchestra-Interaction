<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ORCHESTRA VARIABLE · 线性联动标定版</title>
  <style>
    @font-face {
      font-family: "Orchestra Variable Top";
      src: url("OrchestraVariableTop-VariableVF.ttf") format("truetype");
      font-weight: 0 900;
    }
    @font-face {
      font-family: "Orchestra Variable Bottom";
      src: url("OrchestraVariableBottom-VariableVF.ttf") format("truetype");
      font-weight: 0 900;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #f5f1e8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
      background: #000;
    }
    #wordContainer {
      position: absolute;
      left: 50%;
      top: 48%;
      transform: translate(-50%, -50%);
      width: fit-content;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      pointer-events: none;
      z-index: 1;
    }
    #topRow, #bottomRow {
      display: flex;
      justify-content: center;
      white-space: nowrap;
      letter-spacing: 0.02em;
      line-height: 1;
    }
    .top-char, .bottom-char {
      color: #f5f1e8;
      display: inline-block;
      will-change: font-variation-settings;
    }
    .top-char { font-family: "Orchestra Variable Top", serif; }
    .bottom-char { font-family: "Orchestra Variable Bottom", serif; }

    /* 左上角临时调试面板 */
    #debugPanel {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      z-index: 30;
      width: min(300px, 64vw);
      padding: 10px 12px;
      border: 1px solid rgba(245, 241, 232, 0.35);
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      gap: 9px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .slider-label {
      display: flex;
      justify-content: space-between;
      color: rgba(245, 241, 232, 0.9);
    }
    .slider-label span:last-child {
      font-weight: 600;
      color: #fff;
    }
    input[type="range"] {
      width: 100%;
      margin: 0;
      accent-color: #f5f1e8;
      cursor: pointer;
    }
    .preset-row {
      display: flex;
      gap: 6px;
      margin-top: 2px;
    }
    .preset-btn {
      flex: 1;
      appearance: none;
      border: 1px solid rgba(245, 241, 232, 0.45);
      background: rgba(25, 25, 25, 0.9);
      color: #f5f1e8;
      padding: 4px 6px;
      font-size: 11px;
      cursor: pointer;
    }
    .preset-btn:active {
      background: #f5f1e8;
      color: #000;
    }
    .xhet-info {
      font-size: 11px;
      color: rgba(245, 241, 232, 0.68);
      border-top: 1px solid rgba(245, 241, 232, 0.16);
      padding-top: 6px;
      display: flex;
      justify-content: space-between;
    }

    #footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(36px, calc(env(safe-area-inset-bottom) + 20px));
      z-index: 20;
      padding: 8px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px 12px;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(6px);
      color: rgba(245, 241, 232, 0.88);
      font-size: clamp(11px, 1.8vw, 14px);
      letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums;
    }
    #weightReadout {
      padding: 4px 10px;
      border: 1px solid rgba(245, 241, 232, 0.28);
      background: rgba(0, 0, 0, 0.8);
      color: #f5f1e8;
      white-space: nowrap;
    }
    #startButton {
      appearance: none;
      border: 1px solid rgba(245, 241, 232, 0.75);
      padding: clamp(6px, 1vh, 9px) clamp(12px, 2vw, 18px);
      background: rgba(22, 22, 22, 0.95);
      color: #f5f1e8;
      font: inherit;
      letter-spacing: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    #startButton:active {
      background: #f5f1e8;
      color: #000;
    }
    #startButton:disabled {
      opacity: 0.45;
      cursor: wait;
    }
    #status {
      display: inline-block;
      max-width: 92vw;
      color: rgba(245, 241, 232, 0.82);
      text-align: center;
      line-height: 1.35;
    }

    #cameraFrame {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      width: clamp(90px, min(200px, 22vw), 200px);
      aspect-ratio: 4 / 3;
      padding: 3px;
      border: 1px solid rgba(245, 241, 232, 0.45);
      background: rgba(0, 0, 0, 0.8);
      overflow: hidden;
      z-index: 10;
    }
    #cameraPreview {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      transform: scaleX(-1);
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <!-- 临时参数测试滑块 -->
    <div id="debugPanel">
      <div class="slider-group">
        <div class="slider-label">
          <span>字重 (wght)</span>
          <span id="wghtVal">0</span>
        </div>
        <input id="wghtSlider" type="range" min="0" max="900" step="1" value="0">
        <div class="preset-row">
          <button type="button" class="preset-btn" id="btnMinWght">最细 (0)</button>
          <button type="button" class="preset-btn" id="btnMaxWght">最粗 (900)</button>
        </div>
      </div>

      <div class="slider-group">
        <div class="slider-label">
          <span>字号 (font-size)</span>
          <span id="sizeVal">360 px</span>
        </div>
        <input id="sizeSlider" type="range" min="24" max="420" step="1" value="360">
      </div>

      <div class="slider-group">
        <div class="slider-label">
          <span>行间距 (gap)</span>
          <span id="gapVal">0 px</span>
        </div>
        <input id="gapSlider" type="range" min="0" max="140" step="1" value="0">
      </div>

      <div class="xhet-info">
        <span>XHET 基准 / 总和</span>
        <span id="xhetBaseVal">50 + 50 = 100</span>
      </div>
    </div>

    <div id="wordContainer" aria-label="ORCHESTRAVARIABLE">
      <div id="topRow"></div>
      <div id="bottomRow"></div>
    </div>

    <div id="cameraFrame" aria-label="摄像头画面">
      <canvas id="cameraPreview" width="320" height="240"></canvas>
    </div>

    <div id="footer">
      <span id="weightReadout">wght 0</span>
      <button id="startButton" type="button">开启摄像头</button>
      <span id="status" aria-live="polite"></span>
    </div>

    <video id="video" playsinline muted style="display:none"></video>
  </div>

<script type="module">
  import {
    FilesetResolver,
    HandLandmarker
  } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

  const TEXT = "ORCHESTRAVARIABLE";
  const CHAR_COUNT = TEXT.length;
  const SPLIT_INDEX = 9;

  // 标定锚点：最细 (wght=0) -> 360px / gap 0px；最粗 (wght=900) -> 140px / gap 55px
  const MIN_FONT_SIZE = 360;
  const MAX_FONT_SIZE = 140;
  const MIN_GAP_PX = 0;
  const MAX_GAP_PX = 55;

  // XHET 基准：最细 50 + 50 = 100；最粗 75 + 75 = 150
  const MIN_BASE_XHET = 50;
  const MAX_BASE_XHET = 75;

  const video = document.querySelector("#video");
  const cameraPreview = document.querySelector("#cameraPreview");
  const previewContext = cameraPreview.getContext("2d", { willReadFrequently: true });
  const topRow = document.querySelector("#topRow");
  const bottomRow = document.querySelector("#bottomRow");
  const wordContainer = document.querySelector("#wordContainer");
  const status = document.querySelector("#status");
  const weightReadout = document.querySelector("#weightReadout");
  const startButton = document.querySelector("#startButton");

  // 滑块控件
  const wghtSlider = document.querySelector("#wghtSlider");
  const sizeSlider = document.querySelector("#sizeSlider");
  const gapSlider = document.querySelector("#gapSlider");
  const wghtVal = document.querySelector("#wghtVal");
  const sizeVal = document.querySelector("#sizeVal");
  const gapVal = document.querySelector("#gapVal");
  const xhetBaseVal = document.querySelector("#xhetBaseVal");
  const btnMinWght = document.querySelector("#btnMinWght");
  const btnMaxWght = document.querySelector("#btnMaxWght");

  const topSpans = [];
  const bottomSpans = [];

  for (let i = 0; i < CHAR_COUNT; i++) {
    const ch = TEXT[i];

    const tSpan = document.createElement("span");
    tSpan.className = "top-char";
    tSpan.textContent = ch;
    topRow.appendChild(tSpan);
    topSpans.push(tSpan);

    const bSpan = document.createElement("span");
    bSpan.className = "bottom-char";
    bSpan.textContent = ch;
    bottomRow.appendChild(bSpan);
    bottomSpans.push(bSpan);
  }

  const currentWeights = new Array(CHAR_COUNT).fill(0);
  const currentXhetDeltas = new Array(CHAR_COUNT).fill(0);

  let palmStableFrames = 0;
  const PALM_STABLE_NEED = 6;

  let landmarker = null;
  let stream = null;
  let animationId = null;
  let lastVideoTime = -1;

  // 根据字重线性计算对应的字号和间距，并同步到滑块
  function syncLinearMetricsFromWeight(wght) {
    const t = Math.max(0, Math.min(1, wght / 900));
    const linearSize = Math.round(MIN_FONT_SIZE + (MAX_FONT_SIZE - MIN_FONT_SIZE) * t);
    const linearGap = Math.round(MIN_GAP_PX + (MAX_GAP_PX - MIN_GAP_PX) * t);
    sizeSlider.value = String(linearSize);
    gapSlider.value = String(linearGap);
  }

  function updateDOM() {
    const fontSize = Number(sizeSlider.value);
    const gapPx = Number(gapSlider.value);
    const avgW = currentWeights.reduce((a, b) => a + b, 0) / CHAR_COUNT;
    const t = Math.max(0, Math.min(1, avgW / 900));

    // 当前字重下的 XHET 基准中点（50 -> 75）与上下总和（100 -> 150）
    const baseXhet = MIN_BASE_XHET + (MAX_BASE_XHET - MIN_BASE_XHET) * t;
    const totalXhet = baseXhet * 2;

    // 同步滑块和状态显示
    wghtSlider.value = String(Math.round(avgW));
    wghtVal.textContent = String(Math.round(avgW));
    sizeVal.textContent = `${fontSize} px`;
    gapVal.textContent = `${gapPx} px`;
    xhetBaseVal.textContent = `${Math.round(baseXhet)} + ${Math.round(baseXhet)} = ${Math.round(totalXhet)}`;

    // 直接应用当前间距与字号（无缓动）
    wordContainer.style.gap = `${gapPx}px`;

    for (let i = 0; i < CHAR_COUNT; i++) {
      const w = Math.round(currentWeights[i]);
      const charT = Math.max(0, Math.min(1, w / 900));
      const charBaseXhet = MIN_BASE_XHET + (MAX_BASE_XHET - MIN_BASE_XHET) * charT;
      const charTotalXhet = charBaseXhet * 2;

      const delta = currentXhetDeltas[i];
      const bottomXhet = Math.min(charTotalXhet, Math.max(0, charBaseXhet + delta));
      const topXhet = charTotalXhet - bottomXhet;

      topSpans[i].style.fontSize = `${fontSize}px`;
      bottomSpans[i].style.fontSize = `${fontSize}px`;

      topSpans[i].style.fontVariationSettings =
        `"wght" ${w}, "XHET" ${Math.round(topXhet)}, "wdth" 75, "opsz" 72`;
      bottomSpans[i].style.fontVariationSettings =
        `"wght" ${w}, "XHET" ${Math.round(bottomXhet)}, "wdth" 75, "opsz" 72`;
    }
    weightReadout.textContent = `wght ${Math.round(avgW)}`;
  }

  // 拖动字重滑块时，字号和间距按 360/0 -> 140/55 匀速线性联动
  wghtSlider.addEventListener("input", () => {
    const w = Number(wghtSlider.value);
    currentWeights.fill(w);
    syncLinearMetricsFromWeight(w);
    updateDOM();
  });

  // 单独微调字号或间距滑块
  sizeSlider.addEventListener("input", updateDOM);
  gapSlider.addEventListener("input", updateDOM);

  btnMinWght.addEventListener("click", () => {
    currentWeights.fill(0);
    syncLinearMetricsFromWeight(0);
    updateDOM();
  });

  btnMaxWght.addEventListener("click", () => {
    currentWeights.fill(900);
    syncLinearMetricsFromWeight(900);
    updateDOM();
  });

  function renderCameraPreview() {
    if (video.readyState < 2) return;
    previewContext.drawImage(video, 0, 0, cameraPreview.width, cameraPreview.height);
    const frame = previewContext.getImageData(0, 0, cameraPreview.width, cameraPreview.height);
    const pixels = frame.data;
    for (let i = 0; i < pixels.length; i += 4) {
      const gray = 0.299 * pixels[i] + 0.587 * pixels[i + 1] + 0.114 * pixels[i + 2];
      const level = Math.min(4, Math.round(gray / 255 * 4));
      const value = [0, 64, 128, 192, 255][level];
      pixels[i] = pixels[i + 1] = pixels[i + 2] = value;
    }
    previewContext.putImageData(frame, 0, 0);
  }

  async function start() {
    startButton.disabled = true;
    status.textContent = "正在请求摄像头权限…";
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("当前浏览器环境不支持调用摄像头，请使用 Safari 或 Chrome 的 HTTPS 链接打开");
      }

      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();

      status.textContent = "摄像头已开启，正在加载手势模型…";
      loop();

      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

      landmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 2
      });

      status.textContent = "请将一只手横向摊开";
      startButton.textContent = "终止摄像";
      startButton.disabled = false;
      updateDOM();
    } catch (error) {
      console.error(error);
      stopCameraOnly();
      status.textContent = "启动失败：" + (error.message || error);
      startButton.textContent = "开启摄像头";
      startButton.disabled = false;
      updateDOM();
    }
  }

  function loop() {
    if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
      lastVideoTime = video.currentTime;
      renderCameraPreview();
      if (landmarker) {
        const results = landmarker.detectForVideo(video, performance.now());
        updateFromResults(results);
      }
    }
    animationId = requestAnimationFrame(loop);
  }

  function distance(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  function parseHand(points) {
    const wrist = points[0];
    const middleMcp = points[9];
    const middleTip = points[12];
    const indexTip = points[8];
    const palmScale = Math.max(distance(wrist, middleMcp), 0.001);

    const tips = [4, 8, 12, 16, 20];
    const reaches = tips.map(idx => distance(points[idx], wrist) / palmScale);
    const openness = reaches.reduce((a, b) => a + b, 0) / reaches.length;

    const indexR = reaches[1], middleR = reaches[2], ringR = reaches[3], pinkyR = reaches[4];
    const fingersCurled = indexR < 1.22 && middleR < 1.22 && ringR < 1.22 && pinkyR < 1.22;
    const isFist = openness < 1.22 && fingersCurled;

    const axisX = middleMcp.x - wrist.x;
    const axisY = middleMcp.y - wrist.y;
    const axisLen = Math.hypot(axisX, axisY) || 0.001;
    const verticalRatio = Math.abs(axisY) / axisLen;
    const isNearlyHorizontal = verticalRatio < 0.32;
    const isOpenPalm = openness > 1.68;

    const ringTip = points[16];
    const tipYSpread = Math.max(
      Math.abs(indexTip.y - middleTip.y),
      Math.abs(ringTip.y - middleTip.y),
      Math.abs(indexTip.y - ringTip.y)
    );
    const fingersAligned = tipYSpread < 0.07;
    const isHorizontalPalm = isNearlyHorizontal && isOpenPalm && fingersAligned;

    const mirroredX = Math.max(0, Math.min(1, 1 - indexTip.x));
    const letterPos = mirroredX * (CHAR_COUNT - 1);

    const normalizedHeight = Math.max(0, Math.min(1, (0.85 - indexTip.y) / 0.7));
    // 偏移幅度随当前 XHET 基准同步（最细 ±75，最粗 ±112.5）
    const xhetDelta = (normalizedHeight - 0.5) * 150;
    const weightFromY = Math.round(normalizedHeight * 900);

    const xs = points.map(p => p.x);
    const ys = points.map(p => p.y);
    const apparentArea = (Math.max(...xs) - Math.min(...xs)) *
      (Math.max(...ys) - Math.min(...ys));

    return {
      mirroredX,
      apparentArea,
      letterPos,
      xhetDelta,
      isFist,
      isHorizontalPalm,
      weightFromY,
      openness,
      verticalRatio
    };
  }

  function updateFromResults(results) {
    const rawHands = results.landmarks || [];

    if (rawHands.length === 0) {
      palmStableFrames = 0;
      for (let i = 0; i < CHAR_COUNT; i++) {
        currentXhetDeltas[i] += (0 - currentXhetDeltas[i]) * 0.2;
      }
      updateDOM();
      status.textContent = "未检测到手 · 字重保持";
      return;
    }

    const parsed = rawHands
      .map(parseHand)
      .sort((a, b) => b.apparentArea - a.apparentArea)
      .slice(0, 2)
      .sort((a, b) => a.mirroredX - b.mirroredX);

    let leftHand = null;
    let rightHand = null;

    if (parsed.length >= 2) {
      leftHand = parsed[0];
      rightHand = parsed[parsed.length - 1];
    } else {
      if (parsed[0].mirroredX < 0.5) leftHand = parsed[0];
      else rightHand = parsed[0];
    }

    const freezeLeft = leftHand ? leftHand.isFist : false;
    const freezeRight = rightHand ? rightHand.isFist : false;

    const weightHand = parsed
      .filter(h => h.isHorizontalPalm)
      .sort((a, b) => b.apparentArea - a.apparentArea)[0];

    if (weightHand) {
      palmStableFrames++;
    } else {
      palmStableFrames = 0;
    }

    const isAdjustingWeight = !!weightHand;

    if (!isAdjustingWeight) {
      const targetDeltas = new Array(CHAR_COUNT).fill(0);

      if (parsed.length === 1) {
        const h = parsed[0];
        const spread = 2.2;
        for (let i = 0; i < CHAR_COUNT; i++) {
          const dist = Math.abs(i - h.letterPos);
          const factor = Math.exp(-(dist * dist) / (2 * spread * spread));
          targetDeltas[i] = h.xhetDelta * factor;
        }
      } else {
        const lH = parsed[0];
        const rH = parsed[parsed.length - 1];
        const span = Math.max(rH.letterPos - lH.letterPos, 0.001);

        for (let i = 0; i < CHAR_COUNT; i++) {
          if (i <= lH.letterPos) {
            const dist = lH.letterPos - i;
            targetDeltas[i] = lH.xhetDelta * Math.exp(-(dist * dist) / 4);
          } else if (i >= rH.letterPos) {
            const dist = i - rH.letterPos;
            targetDeltas[i] = rH.xhetDelta * Math.exp(-(dist * dist) / 4);
          } else {
            const t = (i - lH.letterPos) / span;
            targetDeltas[i] = lH.xhetDelta + t * (rH.xhetDelta - lH.xhetDelta);
          }
        }
      }

      for (let i = 0; i < CHAR_COUNT; i++) {
        const isLeftSide = i < SPLIT_INDEX;
        const isFrozen = isLeftSide ? freezeLeft : freezeRight;
        if (isFrozen) continue;
        currentXhetDeltas[i] += (targetDeltas[i] - currentXhetDeltas[i]) * 0.28;
      }
    }

    // 去掉加粗缓动：直接同步目标字重、字号与行间距
    if (weightHand && palmStableFrames >= PALM_STABLE_NEED) {
      const targetW = weightHand.weightFromY;
      currentWeights.fill(targetW);
      syncLinearMetricsFromWeight(targetW);
    }

    updateDOM();

    if (weightHand) {
      status.textContent = palmStableFrames >= PALM_STABLE_NEED
        ? "调整字重中 · XHET 已锁定"
        : "摊开手掌以调整字重";
    } else {
      status.textContent = "请将一只手横向摊开";
    }
  }

  function stopCameraOnly() {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }
    video.srcObject = null;
    previewContext.clearRect(0, 0, cameraPreview.width, cameraPreview.height);
  }

  function stop() {
    if (animationId) cancelAnimationFrame(animationId);
    animationId = null;
    stopCameraOnly();
    if (landmarker) {
      landmarker.close();
      landmarker = null;
    }
    currentWeights.fill(0);
    currentXhetDeltas.fill(0);
    palmStableFrames = 0;
    syncLinearMetricsFromWeight(0);
    updateDOM();
    startButton.textContent = "开启摄像头";
    startButton.disabled = false;
    status.textContent = "已停止";
  }

  startButton.addEventListener("click", () => {
    if (stream) stop();
    else start();
  });
  window.addEventListener("beforeunload", stopCameraOnly);

  syncLinearMetricsFromWeight(0);
  updateDOM();
</script>
</body>
</html>
